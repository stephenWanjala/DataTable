site_name: Compose DataTable
site_description: A feature-rich DataTable component for Compose Desktop, built entirely on Foundation APIs.
site_author: Wanjala Stephen
# Every version lives under its own path, so the canonical URL and sitemap of a build have to
# name the version they belong to. The Docs workflow sets this; the fallback is what a local
# `mkdocs serve` gets.
site_url: !ENV [DOCS_SITE_URL, "https://stephenwanjala.github.io/DataTable/latest/"]

repo_url: https://github.com/stephenWanjala/DataTable
repo_name: stephenWanjala/DataTable
edit_uri: edit/master/docs/

# mike drives the build, and unlike `mkdocs build --strict` it has no flag for this, so the
# setting lives here: a broken link or a page missing from the nav fails the build.
strict: true

copyright: Copyright &copy; 2025 Wanjala Stephen — Apache License 2.0

theme:
  name: material
  # Holds main.html, which fills in Material's `outdated` banner block for any version that is
  # not the current release.
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow

extra:
  # Renders the version selector next to the site title, reading the versions.json that mike
  # writes at the root of the gh-pages branch. `default: latest` is the alias visitors land on.
  version:
    provider: mike
    default: latest
    alias: true
  # "dev" for the in-progress build published off master, "release" otherwise. Set by the Docs
  # workflow; picks which wording overrides/main.html shows in the banner.
  channel: !ENV [DOCS_CHANNEL, "release"]

# Styles the grouped-header illustration in guide/columns.md.
extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  # The guides mark shortcuts as ++ctrl++ / ++enter++; without this they render literally.
  - pymdownx.keys
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

# The Dokka output is copied into docs/api/ before the build, so MkDocs picks it up as a
# static asset and serves it at /api/.
not_in_nav: |
  api/**

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guide:
      - Columns: guide/columns.md
      - Selection & Expansion: guide/selection.md
      - Sorting & Paging: guide/sorting-and-paging.md
      - Grouping: guide/grouping.md
      - Interactions: guide/interactions.md
      - Cell Editing: guide/editing.md
      - Theming: guide/theming.md
  - Migration: migration.md
  - API Reference: api/index.html
