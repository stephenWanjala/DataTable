name: Docs

# Every build is published into its own directory on the gh-pages branch by mike, which also
# maintains the versions.json behind the theme's version selector:
#
#   push to master   -> "dev", the in-progress docs; never becomes the default
#   release          -> "<major>.<minor>", and moves the "latest" alias unless it is a prerelease
#   workflow_dispatch -> whatever you ask for, including older tags (see the inputs below)
#
# GitHub Pages serves the gh-pages branch directly, so pushing to it is the deployment — the
# "pages build and deployment" run that follows each push is GitHub's own. If the Pages source is
# ever switched to "GitHub Actions", nothing publishes the push at all: this workflow goes green,
# gh-pages updates, and the site quietly keeps serving whatever it last built. That happened
# between 0.4 and 0.5 and read as a docs bug for a day, so the last step now checks the setting
# and fails the run rather than letting it pass unnoticed.

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'overrides/**'
      - 'DataTable/src/**'
      - 'DataTable/build.gradle.kts'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  release:
    types: [released, prereleased]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to build the docs from.'
        default: 'master'
      version:
        description: 'Directory to publish into (e.g. 0.3). Blank derives it from the ref: a tag becomes major.minor, master becomes dev.'
        default: ''
      latest:
        description: 'Move the "latest" alias — what visitors land on — to this build.'
        type: boolean
        default: false

# Serialised rather than cancelled: each run commits to gh-pages, so a cancelled run could
# leave the branch without the version it was midway through writing.
concurrency:
  group: docs
  cancel-in-progress: false

permissions:
  contents: write   # mike commits and pushes the built site to gh-pages, which is the deployment
  pages: read       # the guard step below reads the Pages config to check the push will be served

jobs:
  publish:
    name: Publish version
    runs-on: ubuntu-latest
    steps:
      - name: Decide what to publish
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          IN_REF: ${{ inputs.ref }}
          IN_VERSION: ${{ inputs.version }}
          IN_LATEST: ${{ inputs.latest }}
        run: |
          set -euo pipefail

          # 0.4.1 and v0.4.1 both publish to "0.4", so a patch release replaces the docs of the
          # line it belongs to instead of adding another entry to the selector.
          minor() { echo "$1" | sed -E 's/^v//; s/^([0-9]+\.[0-9]+).*/\1/'; }

          alias=""
          case "$EVENT" in
            push)
              ref=master; version=dev ;;
            release)
              ref="$TAG"; version="$(minor "$TAG")"
              [ "$PRERELEASE" = "true" ] || alias=latest ;;
            workflow_dispatch)
              ref="${IN_REF:-master}"
              version="$IN_VERSION"
              if [ -z "$version" ]; then
                case "$ref" in
                  master|main) version=dev ;;
                  *) version="$(minor "$ref")" ;;
                esac
              fi
              [ "$IN_LATEST" = "true" ] && alias=latest || true ;;
          esac

          # Drives the banner wording in overrides/main.html.
          [ "$version" = "dev" ] && channel=dev || channel=release

          {
            echo "ref=$ref"
            echo "version=$version"
            echo "alias=$alias"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"

          echo "Publishing $ref as \"$version\"${alias:+ (alias: $alias)}."

      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.plan.outputs.ref }}
          # mike needs the gh-pages history, and an older ref needs origin/master to borrow the
          # docs tooling from.
          fetch-depth: 0

      # Tags older than the version selector were built by a mkdocs.yml that knows nothing about
      # it, and would render without a way to reach any other version. Their own docs/ and nav
      # are left exactly as they were; only the theme wiring is brought forward.
      # Tags older than the version selector were built by a mkdocs.yml that knows nothing
      # about it. The script overlays the theme wiring only, and no-ops on anything current.
      - name: Adopt the current docs tooling for an older ref
        run: |
          set -euo pipefail
          if ! grep -q 'provider: mike' mkdocs.yml; then
            git checkout origin/master -- .github/scripts overrides requirements-docs.txt
          fi
          python3 .github/scripts/adopt-docs-tooling.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate API reference
        run: ./gradlew :DataTable:dokkaGeneratePublicationHtml --no-configuration-cache

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs and mike
        run: pip install -r requirements-docs.txt

      # Copied in before the build so MkDocs treats it as a static asset and serves it at /api/,
      # which gives every published version the API reference that belongs to it.
      - name: Mount API reference
        run: |
          rm -rf docs/api
          cp -r build/dokka docs/api

      - name: Publish to gh-pages
        env:
          DOCS_CHANNEL: ${{ steps.plan.outputs.channel }}
          DOCS_SITE_URL: https://stephenwanjala.github.io/DataTable/${{ steps.plan.outputs.version }}/
          VERSION: ${{ steps.plan.outputs.version }}
          ALIAS: ${{ steps.plan.outputs.alias }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          title="$VERSION"
          [ "$VERSION" = "dev" ] && title='dev (unreleased)'

          # alias-type=copy because GitHub Pages does not follow the symlink mike would
          # otherwise use for "latest".
          mike deploy \
            --push \
            --update-aliases \
            --alias-type=copy \
            --title "$title" \
            "$VERSION" ${ALIAS:+$ALIAS}

          # The site root is a redirect to whatever mike holds as the default, so until something
          # claims it the root is a 404. "latest" claims it as soon as a release exists; before
          # that, the first version published stands in so the root is never dead.
          git fetch -q origin gh-pages
          if mike list 2>/dev/null | grep -qw latest; then
            mike set-default --push latest
          elif ! git cat-file -e origin/gh-pages:index.html 2>/dev/null; then
            echo 'No release published yet; pointing the site root at this build.'
            mike set-default --push "$VERSION"
          fi

          mike list

      # Deliberately last rather than first: a wrong setting is no reason to skip the deploy.
      # gh-pages ends up correct either way, so putting the setting back is the whole fix — this
      # only refuses to call the run a success while the site is not actually serving the push.
      - name: Check that Pages will serve what was just pushed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          # A read failure is not evidence of a misconfiguration — say so and move on rather than
          # failing a run whose docs are fine.
          config="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '"\(.build_type) \(.source.branch)"' 2>/dev/null)" || config=""
          if [ -z "$config" ]; then
            echo '::warning::Could not read the Pages configuration; skipping the check.'
            exit 0
          fi

          read -r build_type branch <<<"$config"

          if [ "$build_type" = 'legacy' ] && [ "$branch" = 'gh-pages' ]; then
            echo "Pages serves the $branch branch, so the push above is live."
            exit 0
          fi

          echo "::error::Pages will not serve this deploy (build_type=$build_type, source=$branch). The docs are on gh-pages; the site setting is wrong."

          # Only one of the two is usually wrong; mark which, so the row to act on is obvious.
          [ "$build_type" = 'legacy' ] && type_mark='ok' || type_mark='**wrong**'
          [ "$branch" = 'gh-pages' ] && branch_mark='ok' || branch_mark='**wrong**'

          {
            echo '## The docs were published, but the site will not show them'
            echo
            echo '`mike` pushed to **gh-pages** successfully. The branch is correct and nothing'
            echo 'needs rebuilding — GitHub Pages is simply not serving it:'
            echo
            echo '| | Found | Needs | |'
            echo '|---|---|---|---|'
            echo "| Build type | \`$build_type\` | \`legacy\` — \"Deploy from a branch\" | $type_mark |"
            echo "| Source branch | \`$branch\` | \`gh-pages\` | $branch_mark |"
            echo
            echo 'Fix it under **Settings → Pages → Build and deployment**, or run:'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          sed "s|OWNER/REPO|$GITHUB_REPOSITORY|g" >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ```bash
          gh api -X PUT repos/OWNER/REPO/pages --input - <<'JSON'
          {"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}
          JSON
          gh api -X POST repos/OWNER/REPO/pages/builds
          ```
          SUMMARY

          exit 1
